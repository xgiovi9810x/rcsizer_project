[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcsizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pytest>=7.4",
    "numpy>=2.5.0",
    "streamlit>=1.30",
    "plotly>=7.1.0",
    "pandas>=3.1.1"
]

[tool.pytest.ini_options]
testpaths = ["rcsizer/tests"]
